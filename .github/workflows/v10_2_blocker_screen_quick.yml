name: V10.2 Quick Blocker Rejection Screen

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-stability-fix ]
    paths:
      - '.github/workflows/v10_2_blocker_screen_quick.yml'

concurrency:
  group: v10-2-blocker-screen-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-stability-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615
      - name: Run rejection-only quick screen
        run: |
          python src/v10_2_blocker_screen.py \
            --oos v941/oos_predictions.parquet \
            --chosen931 v941/chosen_v931_config_by_fold.csv \
            --config config_v9_4_1.json \
            --sims 20 \
            --output quick_blocker
      - uses: actions/upload-artifact@v4
        with:
          name: v10-2-quick-blocker-screen
          path: quick_blocker/
          retention-days: 30
