name: V13 Apollo original XML capture
on:
  push:
    branches: [v13-apollo-dual-rsi-fix-20261112]
    paths: ['.github/workflows/v13_apollo_xml_capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture the original already-known financial version
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          import json,hashlib
          from datetime import datetime,timezone
          out=Path('xml_capture');out.mkdir()
          url='https://nsearchives.nseindia.com/corporate/xbrl/INTEGRATED_FILING_INDAS_1745384_24102026051130_WEB.xml'
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=45) as r:raw=r.read()
          assert hashlib.sha256(raw).hexdigest()=='870c440603063eac8e5334170c87e05bff1bf717b5777eba4f3a7a8802d7f329'
          (out/'apollo_20260930.xml').write_bytes(raw)
          proof={'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'re_fetched_at_utc':datetime.now(timezone.utc).isoformat(),'matches_previous_captured_version':True}
          (out/'receipt.json').write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v13-apollo-original-xml
          path: xml_capture/
          retention-days: 30
