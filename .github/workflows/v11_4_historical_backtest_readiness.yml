name: V11.4 Historical 18-Fold Backtest Readiness No-Leak
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths: [.github/workflows/v11_4_historical_backtest_readiness.yml]
permissions:
  actions: read
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - name: Confirm maturity and binary-label isolation test suite
        run: |
          python -m py_compile src/v11_4_backtest_readiness_pit.py
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_backtest_readiness_pit.py -v
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-18fold-NSE-catalyst-asof-research-features
          path: catalyst_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37762815652
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Restore immutable 18 test dates
        run: |
          git fetch origin v10-fresh-current --depth 1
          git show FETCH_HEAD:published_v9_4_1/chosen_v941_gates_by_fold.csv > folds.csv
      - name: Audit exact 18-fold stock identities and future-y6 isolation
        shell: bash
        run: |
          CAT=$(find catalyst_seed -name canonical_NSE_18fold_catalyst_metadata_PIT_RESEARCH.parquet -print -quit)
          SNAP=$(find frozen_seed -name snapshot_dataset.parquet -print -quit)
          test -n "$CAT" && test -n "$SNAP"
          python src/v11_4_backtest_readiness_pit.py \
            --snapshot "$SNAP" --catalyst-features "$CAT" \
            --folds folds.csv --output outputs_backtest_readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-original-18fold-y6-catalyst-readiness-no-leak
          path: outputs_backtest_readiness/
          if-no-files-found: warn
          retention-days: 90
