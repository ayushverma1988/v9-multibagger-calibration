name: V11.4 FY2023 Historical Original NSE Annual XBRL Source Pilot
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_fy2023_historical_annual_pilot.yml
      - src/v11_4_fy2023_historical_annual_pilot.py
      - tests/test_v11_4_fy2023_historical_annual_pilot.py
permissions:
  contents: read
  actions: read
jobs:
  independent-FY2023-pit-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3' 'pyarrow>=18,<26'
      - name: Restore historical NSE annual XBRL parser and validate strict fiscal PIT guards
        run: |
          set -euo pipefail
          git fetch origin v10-fresh-current --depth 1
          git show FETCH_HEAD:src/v11_4_longterm_fundamentals.py > src/v11_4_longterm_fundamentals.py
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_fy2023_historical_annual_pilot.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_strict_annual_facts.py -v
          python -m py_compile src/v11_4_fy2023_historical_annual_pilot.py
      - name: Download timestamped original NSE annual filing index (historical universe only)
        uses: actions/download-artifact@v4
        with:
          name: v11-4-full-market-annual-index-PIT-rehearsal
          path: original_annual_index
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37751840549
      - name: Download frozen original NSE historical stock identities (not predictions)
        uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_exchange_universe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Independently recover at most 24 pre-2023-December NSE original XBRL financial pairs
        run: |
          set -euo pipefail
          INDEX=$(find original_annual_index -name full_historical_annual_index_PIT_CANDIDATES.csv -print -quit)
          SNAP=$(find frozen_exchange_universe -name snapshot_dataset.parquet -print -quit)
          test -n "$INDEX" && test -n "$SNAP"
          python src/v11_4_fy2023_historical_annual_pilot.py \
            --annual-index "$INDEX" \
            --snapshot "$SNAP" \
            --max-companies 24 \
            --output fy2023_original_market_financial_pit_research
      - name: Retain original FY2023 audited evidence only; don't edit existing stock picks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-FY2023-official-NSE-historic-financial-XBRL-pilot
          path: fy2023_original_market_financial_pit_research/
          retention-days: 90
          if-no-files-found: warn
