name: V13 daily chart diagnostics
env:
  V13_COMPACT_ARCHIVE: '1'
  V13_WORKING_CORE_ARCHIVE: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
on:
  workflow_run:
    workflows: [V13 NSE Research Collector and Learner]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v13_chart_diagnostics.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-chart-diagnostics
  cancel-in-progress: false
jobs:
  chart:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2302ced5fcf4f41a64264154d71682bf9eab9cf0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v13_storage.txt
      - name: Test both checkpoint formats and complete existing contracts
        env:
          # Legacy fixtures mock an uncompressed archive; compact-storage tests
          # enable their mode explicitly. Keep production compact I/O enabled.
          V13_COMPACT_ARCHIVE: '0'
          V13_WORKING_CORE_ARCHIVE: '0'
        run: python -m unittest discover -s tests
      - name: Stream and hash-check the completed collector artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_WORKER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess,requests
          from pathlib import Path
          from v13_archive_retention import download_artifact
          repo=os.environ['GITHUB_REPOSITORY'];headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']}
          def get(path):
              r=requests.get('https://api.github.com/repos/'+repo+path,headers=headers,timeout=(15,120));r.raise_for_status();return r.json()
          run_id=os.environ.get('SOURCE_WORKER_RUN_ID')
          if not run_id:
              runs=get('/actions/workflows/v13_research_worker.yml/runs?branch=main&status=completed&per_page=20')['workflow_runs']
              run_id=next(r['id'] for r in runs if r['conclusion']=='success')
          artifacts=get(f'/actions/runs/{run_id}/artifacts')['artifacts']
          artifact=next(a for a in artifacts if not a['expired'] and a['name']==f'v13-private-research-state-{run_id}')
          download_artifact(artifact['id'],artifact['digest'],'worker.zip')
          assert Path('worker.zip').stat().st_size==artifact['size_in_bytes']
          Path('source_worker_run.json').write_text(json.dumps({'run_id':int(run_id),'artifact_id':artifact['id'],
              'source_zip_bytes':artifact['size_in_bytes'],'source_zip_digest':artifact['digest'],
              'chart_code':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()},indent=2))
          PYTHON
      - name: Export exact unchanged source bytes in bounded audit parts
        if: github.ref_name == 'fix/v13-recovery-chart-20261103'
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path('parts');out.mkdir();records=[];all_hash=hashlib.sha256();size=0
          with Path('worker.zip').open('rb') as source:
              for i in range(20):
                  raw=source.read(480000000)
                  if not raw:break
                  name=f'part-{i:03d}.bin';(out/name).write_bytes(raw)
                  all_hash.update(raw);size+=len(raw);records.append({'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              if source.read(1):raise ValueError('Artifact exceeds bounded part count')
          original=json.loads(Path('source_worker_run.json').read_text())
          assert 'sha256:'+all_hash.hexdigest()==original['source_zip_digest'] and size==original['source_zip_bytes']
          (out/'receipt.json').write_text(json.dumps({'source':original,'parts':records,'unchanged_original_ZIP':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'fix/v13-recovery-chart-20261103'
        with:
          name: v13-evidence-part-000-${{ github.run_id }}
          path: parts/part-000.bin
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'fix/v13-recovery-chart-20261103' && hashFiles('parts/part-001.bin') != ''
        with:
          name: v13-evidence-part-001-${{ github.run_id }}
          path: parts/part-001.bin
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'fix/v13-recovery-chart-20261103' && hashFiles('parts/part-002.bin') != ''
        with:
          name: v13-evidence-part-002-${{ github.run_id }}
          path: parts/part-002.bin
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'fix/v13-recovery-chart-20261103' && hashFiles('parts/part-003.bin') != ''
        with:
          name: v13-evidence-part-003-${{ github.run_id }}
          path: parts/part-003.bin
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'fix/v13-recovery-chart-20261103' && hashFiles('parts/part-004.bin') != ''
        with:
          name: v13-evidence-part-004-${{ github.run_id }}
          path: parts/part-004.bin
          compression-level: 0
          retention-days: 3
      - name: Verify complete direct exports against the source manifest
        run: python -m v13_worker_artifact --artifact worker.zip --output audit_exports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-verified-monitoring-exports-${{ github.run_id }}
          path: |
            source_worker_run.json
            parts/receipt.json
            audit_exports/
          retention-days: 30
      - name: Independently verify a fresh published compact restart
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
          V13_DECODED_CACHE: checkpoint_verify_decoded
        run: |
          python - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from v13_checkpoint import restore,ARCHIVE
          from v13_archive_codec import archive_download
          from v13_worker_artifact import read_manifest
          from v13_working_archive import migration_matches
          manifest,receipt,manifest_raw=read_manifest('worker.zip')
          if receipt.get('remote_publication_confirmed',True) is not True:
              result={'status':'UNPUBLISHED_RECOVERY_NO_REMOTE_RESTART_CERTIFICATION',
                  'source_manifest_sha256':receipt['manifest_sha256'],'full_raw_source_pool_verified':False}
          else:
              root=Path('independent_restart')
              if root.exists():raise ValueError('Fresh restart directory already exists')
              if not restore(root):raise ValueError('Published checkpoint was not restored')
              restored=(root/'remote_manifest.json').read_bytes()
              published=json.loads(restored)
              same_manifest=hashlib.sha256(restored).hexdigest()==receipt['manifest_sha256']
              if not same_manifest and not migration_matches(manifest_raw,published):
                  raise ValueError('Remote latest checkpoint differs from completed worker; requires separate audit')
              active=[r for r in manifest['files'] if not r['raw_source']]
              for item in active:
                  p=root/item['path']
                  if not p.is_file() or p.stat().st_size!=item['bytes']:
                      raise ValueError('Fresh restored file length differs from exact manifest')
                  if hashlib.file_digest(p.open('rb'),'sha256').hexdigest()!=item['sha256']:
                      raise ValueError('Fresh restored file digest differs from exact manifest')
              protected=['active_heads.joblib','challenger/research_heads.joblib','active_model.json',
                  'prospective_observations.parquet','champion_latest_watchlist.json','challenger_latest_watchlist.json']
              index={r['path']:r for r in active};protected_checks=[]
              for rel in protected:
                  if rel not in index:raise ValueError('Frozen head or ledger absent from published checkpoint')
                  protected_checks.append({'path':rel,'sha256':index[rel]['sha256'],'bytes':index[rel]['bytes']})
              reported=[
                  'v13/object_shards/7d/d2/7dd22cc265ac276fd54f8bb2488aa64fd199c51541c58eebff84756e40a71987.bin',
                  'v13/object_shards/80/e0/80e05681ad2d6b0f4a55ac7e11511528bc19229baf486dc0084b27e1edef9ad8.bin',
                  'v13/storage_index/2026/11/03/4ac8906e2571695aaa86eb397b6fc68ecfb2c2bea3c2430fbbdec442cb4b62f7.parquet',
                  'v13/storage_index/2026/11/03/04736e22d25ffddc78d7ff3b8a584d19d57a79a2deff73313d13c598beea8a13.parquet']
              probes=[]
              for path in reported:
                  if published.get('format')=='V13-content-addressed-checkpoint-4':
                      probes.append({'path':path,'status':'RETIRED_BY_USER_APPROVED_WORKING_ONLY_POLICY'});continue
                  try:
                      p=Path(archive_download(ARCHIVE,path,repo_type='dataset',token=os.environ['HF_ARCHIVE_TOKEN'],force_download=True))
                      sha=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
                      canonical=Path(path).stem if path.endswith('.bin') else None
                      if canonical and sha!=canonical:raise ValueError('Historical logical object digest differs')
                      probes.append({'path':path,'status':'LOGICAL_BYTES_READ','bytes':p.stat().st_size,'sha256':sha})
                  except Exception as exc:
                      probes.append({'path':path,'status':'UNVERIFIED','error_type':type(exc).__name__})
              result={'status':'FRESH_PUBLISHED_RESTART_VERIFIED','source_manifest_sha256':receipt['manifest_sha256'],
                  'snapshot':receipt['snapshot'],'restored_derived_files':len(active),
                  'published_manifest_sha256':hashlib.sha256(restored).hexdigest(),
                  'storage_migration_bridge_verified':not same_manifest,
                  'protected_files':protected_checks,'reported_migration_path_read_checks':probes,
                  'full_raw_source_pool_verified':False,'archive_writes':False,'forecasts_changed':False}
          result['checked_at_utc']=datetime.now(timezone.utc).isoformat()
          Path('checkpoint_restart_verification.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PYTHON
      - name: Annotate frozen forecasts using exact saved histories
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: python -m v13_chart_snapshot --artifact worker.zip --output chart_snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-chart-diagnostics-${{ github.run_id }}
          path: |
            source_worker_run.json
            chart_snapshot/chart_interpretation/
            checkpoint_restart_verification.json
          retention-days: 30
