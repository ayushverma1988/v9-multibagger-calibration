name: V11.4 Alternative Official NSE Archive Valuation Probe
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_nse_archive_valuation_probe.yml
permissions:
  contents: read
jobs:
  archival-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Test direct NSE company P-E report, official index P-E and security master without NSE page API
        run: |
          python -m py_compile src/v11_4_nse_archive_valuation_probe.py
          python src/v11_4_nse_archive_valuation_probe.py \
            --asof 2026-10-08 --output outputs_v11_4_official_valuation_archives
      - name: Upload honest diagnostics; source may be blocked; no invented values
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-official-archive-valuation-source-20261008
          path: outputs_v11_4_official_valuation_archives/
          retention-days: 14
          if-no-files-found: warn
