name: V13 Apollo correction and dual RSI verification
on:
  push:
    branches: [v13-apollo-dual-rsi-fix-20261112]
    paths: ['.github/workflows/v13_apollo_fix_verify.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      V13_COMPACT_ARCHIVE: '1'
      V13_WORKING_CORE_ARCHIVE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v13_storage.txt
      - name: Run complete regression suite
        run: |
          set -euo pipefail
          mkdir -p apollo_fix_output
          python -m unittest discover -s tests -q 2>&1 | tee apollo_fix_output/full_tests.txt
      - name: Preserve corrected Apollo facts and verify both RSI screens
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u -m v13_apollo_repair_run --state v13_state --out apollo_fix_output --publish
      - name: Keep the verified working archive within its existing policy
        if: always()
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: |
          if [ -f apollo_fix_output/apollo_correction_result.json ]; then
            python -m v13_storage_retention
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-apollo-correction-and-dual-rsi
          path: |
            apollo_fix_output/
            v13_storage_retention_receipt.json
          retention-days: 30
