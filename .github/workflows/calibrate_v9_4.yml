name: V9.4 Upside Probability Ladder

on:
  workflow_dispatch:
  push:
    branches: [ main, v9.4-upside-ladder ]
    paths:
      - 'src/calibrate_v9_4.py'
      - 'config_v9_4.json'
      - '.github/workflows/calibrate_v9_4.yml'

jobs:
  calibrate-v9-4:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Download verified legacy NSE artifacts from canonical V9.1 run
        uses: actions/download-artifact@v4
        with:
          pattern: nse-legacy-*
          path: legacy
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36398827406

      - name: Run V9.4 upside probability ladder
        run: python src/calibrate_v9_4.py --config config_v9_4.json --output outputs_v9_4 --legacy-dir legacy

      - name: Upload V9.4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v9-4-upside-ladder-results
          path: outputs_v9_4/
          retention-days: 90

      - name: Publish compact V9.4 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p published_v9_4
          cp outputs_v9_4/summary.json \
             outputs_v9_4/calibrator_100_comparison.csv \
             outputs_v9_4/hit25_6m_calibrator_comparison.csv \
             outputs_v9_4/hit50_6m_calibrator_comparison.csv \
             outputs_v9_4/downside_calibrator_comparison.csv \
             outputs_v9_4/chosen_v931_config_by_fold.csv \
             outputs_v9_4/chosen_v94_ladder_by_fold.csv \
             outputs_v9_4/selection_metrics_by_fold.csv \
             outputs_v9_4/risk_constraint_search.csv \
             outputs_v9_4/ladder_search.csv \
             outputs_v9_4/current_top50.csv \
             published_v9_4/
          git add published_v9_4
          git diff --cached --quiet || git commit -m "Publish V9.4 upside-ladder results [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
