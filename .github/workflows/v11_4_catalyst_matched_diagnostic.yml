name: V11.4 Historical Catalyst Momentum-Matched Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_catalyst_matched_diagnostic.yml
permissions:
  actions: read
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - run: python -m py_compile src/v11_4_catalyst_momentum_matched_diagnostic.py
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-18fold-NSE-catalyst-market-financial-PIT-research-matrix
          path: feature_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37763154846
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_control
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Test 24 original NSE catalyst conditions against fold and momentum/liquidity matched controls
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(find feature_seed -name v11_4_18fold_source_PIT_FEATURES_RESEARCH.parquet -print -quit)
          BASE=$(find frozen_control -name snapshot_dataset.parquet -print -quit)
          test -n "$SRC" && test -n "$BASE"
          python src/v11_4_catalyst_momentum_matched_diagnostic.py \
            --features "$SRC" --frozen-snapshot "$BASE" \
            --output outputs_v11_4_catalyst_matched
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-catalyst-matched-observational-NOT-production-model
          path: outputs_v11_4_catalyst_matched/
          retention-days: 90
          if-no-files-found: warn
