name: V11.4 Predeclared Catalyst Six-Month Association QA
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_catalyst_y6_descriptive_diagnostic.yml
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - run: python -m py_compile src/v11_4_18fold_catalyst_y6_diagnostic.py
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-18fold-NSE-catalyst-market-financial-PIT-research-matrix
          path: source_features
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37763154846
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_outcomes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Test all prespecified catalyst types against clean matured frozen y6 labels in a separate evaluation stage
        shell: bash
        run: |
          set -euo pipefail
          MAT=$(find source_features -name v11_4_18fold_source_PIT_FEATURES_RESEARCH.parquet -print -quit)
          LAB=$(find frozen_outcomes -name snapshot_dataset.parquet -print -quit)
          test -n "$MAT" && test -n "$LAB"
          python src/v11_4_18fold_catalyst_y6_diagnostic.py \
            --features "$MAT" --frozen-labels "$LAB" \
            --output outputs_v11_4_catalyst_y6_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-historical-catalyst-2x-descriptive-NOT-BACKTEST
          path: outputs_v11_4_catalyst_y6_diagnostic/
          retention-days: 90
          if-no-files-found: warn
