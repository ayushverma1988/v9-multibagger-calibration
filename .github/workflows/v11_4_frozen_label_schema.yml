name: V11.4 Frozen Historical V10 Label Schema Probe
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths: [.github/workflows/v11_4_frozen_label_schema.yml]
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Inspect immutable market and six-month outcome labels
        run: |
          SNAP=$(find frozen_seed -name snapshot_dataset.parquet -print -quit)
          test -n "$SNAP"
          python src/v11_4_historical_labels_schema.py --snapshot "$SNAP" --output outputs_frozen_labels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-frozen-V10-snapshot-label-schema
          path: outputs_frozen_labels/
          retention-days: 30
          if-no-files-found: warn
