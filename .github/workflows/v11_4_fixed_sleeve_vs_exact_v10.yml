name: V11.4 Fixed Sleeve versus Exact Frozen V10 Research
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_fixed_sleeve_vs_exact_v10.yml
permissions:
  actions: read
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - run: python -m py_compile src/v11_4_fixed_sleeve_vs_exact_v10_research.py
      - name: Recover frozen acceptance parameters from production branch without editing it
        run: |
          git fetch origin v10-fresh-current --depth 1
          git show FETCH_HEAD:config/v11_4_historical_validation.json > v11_4_frozen_validation_config.json
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: V10_frozen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-18fold-NSE-catalyst-market-financial-PIT-research-matrix
          path: V11_4_PIT_source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37763154846
      - name: Run fixed-rule pre-obvious and second-leg candidate slate against exact original V10 historic Top10
        shell: bash
        run: |
          set -euo pipefail
          OOS=$(find V10_frozen -name oos_predictions.parquet -print -quit)
          FEATURES=$(find V11_4_PIT_source -name v11_4_18fold_source_PIT_FEATURES_RESEARCH.parquet -print -quit)
          test -n "$OOS" && test -n "$FEATURES"
          python src/v11_4_fixed_sleeve_vs_exact_v10_research.py \
            --oos "$OOS" --features "$FEATURES" --frozen-snapshot "$(find V10_frozen -name snapshot_dataset.parquet -print -quit)" \
            --config v11_4_frozen_validation_config.json \
            --output outputs_v11_4_fixed_vs_exact_v10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-fixed-catalyst-sleeve-vs-EXACT-V10-exploratory
          path: outputs_v11_4_fixed_vs_exact_v10/
          retention-days: 90
          if-no-files-found: warn
