name: V13 Public Adjusted-Price Capture
on:
  schedule:
    - cron: '30 11 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '10 16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v13_breadth_capture.yml']
permissions:
  contents: read
concurrency:
  group: v13-public-breadth-capture
  cancel-in-progress: false
jobs:
  public-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9547c16ba171f3595ceb88e7038314faa21c3e20
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5 pandas==2.2.3 pyarrow==25.0.1
      - name: Capture original public bytes before the information cutoff
        env:
          PYTHONPATH: src
        run: python -m v13_breadth_capture
      - name: Identify captured source day
        id: snapshot
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('v13_public_breadth_snapshot/receipt.json')
          if p.exists():print('asof='+json.loads(p.read_text())['source_asof'])
          PY
      - name: Preserve public original and timed receipt
        if: steps.snapshot.outputs.asof != ''
        uses: actions/upload-artifact@v4
        with:
          name: v13-public-breadth-${{ steps.snapshot.outputs.asof }}
          path: |
            v13_public_breadth_snapshot/nse_adjusted.parquet
            v13_public_breadth_snapshot/nse_adjusted_previous.parquet
            v13_public_breadth_snapshot/nse_source_session.zip
            v13_public_breadth_snapshot/nse_holiday_calendar.json
            v13_public_breadth_snapshot/nse_corporate_actions.json
            v13_public_breadth_snapshot/receipt.json
          retention-days: 30
      - name: Keep the exact reason and any primary original when no timely bundle exists
        if: ${{ !cancelled() && steps.snapshot.outputs.asof == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v13-capture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v13_public_breadth_snapshot/unavailable.json
            v13_public_breadth_snapshot/partial_primary/
          if-no-files-found: warn
          retention-days: 7
      - name: Recover the most recent closed NSE session for retrospective checks
        if: ${{ !cancelled() && steps.snapshot.outputs.asof == '' && (github.event_name != 'schedule' || github.event.schedule == '10 16 * * 1-5') }}
        env:
          PYTHONPATH: src
        run: python -m v13_breadth_capture --late-nse-reference
      - name: Keep late NSE originals outside the prospective artifact namespace
        if: ${{ !cancelled() && hashFiles('v13_late_nse_reference/primary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: v13-late-nse-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: v13_late_nse_reference/
          if-no-files-found: error
          retention-days: 14
