name: V11.4 Private Full Financial and Historical Catalyst Archive
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths: [.github/workflows/v11_4_private_full_financial_catalyst_archive.yml]
permissions:
  actions: read
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'huggingface_hub>=0.25,<2'
      - run: python -m py_compile src/v11_4_archive_full_2024_25_and_catalysts.py
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-complete-twofold-NSE-annual-PIT-research-matrix
          path: full_financial_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37763723332
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-18fold-NSE-catalyst-asof-research-features
          path: historical_catalyst_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37762815652
      - name: Save NSE full annual research and 18-fold catalyst source to existing private archive
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: |
          python src/v11_4_archive_full_2024_25_and_catalysts.py \
            --financial full_financial_seed --catalysts historical_catalyst_seed \
            --destination outputs_v11_4_private_full_research \
            --repo-id ayushverma1988/v10-multibagger-archive \
            --prefix v11_4/research/full_PIT_financials_and_18fold_catalysts/20261008
