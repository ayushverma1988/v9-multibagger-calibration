name: V10.2 Corporate Action Source Audit

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-residual-integrity ]
    paths:
      - '.github/workflows/v10_2_action_source_audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-residual-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow huggingface_hub
      - name: Inspect structured 2023 actions
        run: |
          python - <<'PY'
          import json, os
          import pandas as pd
          from huggingface_hub import hf_hub_download
          p=hf_hub_download('tejhq/indian-markets','actions/nse_2023.parquet',repo_type='dataset')
          d=pd.read_parquet(p)
          print("columns",list(d.columns))
          sy=d.get('symbol',pd.Series('',index=d.index)).astype(str).str.upper()
          q=d[sy.isin(['TIPSINDLTD','TIPSMUSIC','MIRZAINT','REDTAPE'])].copy()
          os.makedirs('published_v10_2_action_source_audit',exist_ok=True)
          q.to_csv('published_v10_2_action_source_audit/rows.csv',index=False)
          rec={
            'columns':list(d.columns),
            'rows_2023':int(len(d)),
            'matched_rows':int(len(q)),
            'symbols':q.get('symbol',pd.Series(dtype=str)).astype(str).value_counts().to_dict(),
            'records':q.astype(object).where(pd.notna(q),None).to_dict(orient='records'),
          }
          json.dump(rec,open('published_v10_2_action_source_audit/summary.json','w'),indent=2,default=str)
          print(json.dumps(rec,indent=2,default=str))
          PY
      - name: Publish source audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v10_2_action_source_audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish corporate-action source audit [skip ci]"
          git pull --rebase origin v10.2-residual-integrity
          git push origin HEAD:v10.2-residual-integrity
