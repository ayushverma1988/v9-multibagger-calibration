name: V11.4 PIT Backtest Readiness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v11_4_pit_readiness.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: v11-4-pit-readiness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas pyarrow

      - name: Compile readiness audit
        run: python -m py_compile src/v11_4_pit_readiness.py

      - name: Download canonical event archive
        uses: actions/download-artifact@v4
        with:
          name: v9-7-canonical-events-2016-2026
          path: readiness/events
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36804202373

      - name: Download PIT ownership and financial archive
        uses: actions/download-artifact@v4
        with:
          name: v10-4-pit-archive-fast
          path: readiness/pit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37164416825

      - name: Download V10.2 historical control
        uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: readiness/control
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518

      - name: Audit point-in-time inputs
        run: |
          python src/v11_4_pit_readiness.py \
            --events readiness/events \
            --pit readiness/pit \
            --control readiness/control \
            --output outputs_v11_4_pit_readiness/readiness_summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: v11-4-pit-backtest-readiness
          path: outputs_v11_4_pit_readiness/
          retention-days: 60

      - name: Publish readiness summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_v11_4_pit_readiness
          cp outputs_v11_4_pit_readiness/readiness_summary.json published_v11_4_pit_readiness/
          cp outputs_v11_4_pit_readiness/inventory.csv published_v11_4_pit_readiness/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v11_4_pit_readiness
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish V11.4 PIT backtest readiness [skip ci]"
          git pull --rebase origin v10-fresh-current
          git push origin HEAD:v10-fresh-current
