name: V13 offline test dependencies
on:
  push:
    branches: [v13-apollo-dual-rsi-fix-20261112]
    paths: ['.github/workflows/v13_apollo_test_dependencies.yml']
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip download requests==2.34.2 beautifulsoup4==4.15.0 huggingface_hub==1.33.0 zstandard==0.25.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: v13-test-dependencies
          path: wheels/
          retention-days: 1
