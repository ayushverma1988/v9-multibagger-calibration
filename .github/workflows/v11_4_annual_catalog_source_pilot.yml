name: V11.4 NSE Historical Annual Filing Index Pilot

on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - 'src/v11_4_annual_catalog_source_pilot.py'
      - '.github/workflows/v11_4_annual_catalog_source_pilot.yml'

permissions:
  actions: read
  contents: read

jobs:
  annual-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal financial archive readers
        run: pip install 'pandas>=2.2,<3' 'pyarrow>=18,<26' 'requests>=2.31,<3'
      - name: Compile source pilot
        run: python -m py_compile src/v11_4_annual_catalog_source_pilot.py
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: control_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Probe official NSE annual filing history for historical constituents
        run: |
          SNAP=$(find control_seed -name snapshot_dataset.parquet -print -quit)
          test -n "$SNAP"
          python src/v11_4_annual_catalog_source_pilot.py --snapshot "$SNAP" --sample-size 16 --output outputs_v11_4_annual_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-historical-annual-filing-pilot
          path: outputs_v11_4_annual_pilot/
          if-no-files-found: warn
          retention-days: 60
