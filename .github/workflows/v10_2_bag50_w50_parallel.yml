name: V10.2 Bag50 W50 Parallel All-Fold

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-stability-fix ]
    paths:
      - '.github/workflows/v10_2_bag50_w50_parallel.yml'

concurrency:
  group: v10-2-bag50-w50-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        date:
          - '2017-06-30'
          - '2017-12-29'
          - '2018-06-29'
          - '2018-12-31'
          - '2019-06-28'
          - '2019-12-31'
          - '2020-06-30'
          - '2020-12-31'
          - '2021-06-30'
          - '2021-12-31'
          - '2022-06-30'
          - '2022-12-30'
          - '2023-06-30'
          - '2023-12-29'
          - '2024-06-28'
          - '2024-12-31'
          - '2025-06-30'
          - '2025-12-31'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-stability-fix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615
      - name: Evaluate fold
        env:
          FOLD_DATE: ${{ matrix.date }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0,'src')
          from v10_2_raw_rank_stability import spec_from_row
          from v10_2_bagged_topk import POLICIES, external_stability
          td=pd.Timestamp(os.environ['FOLD_DATE'])
          bp=next(p for p in POLICIES if p.name=='bag50_w50')
          cfg=json.load(open('config_v9_4_1.json')); k=int(cfg.get('selection_k',10))
          oos=pd.read_parquet('v941/oos_predictions.parquet'); oos['date']=pd.to_datetime(oos['date'])
          ch=pd.read_csv('v941/chosen_v931_config_by_fold.csv'); ch['date']=pd.to_datetime(ch['date'])
          cmap={pd.Timestamp(r.date):r for r in ch.itertuples(index=False)}
          g=oos[oos['date']==td].copy()
          st=external_stability(g,spec_from_row(cmap[td]),bp,k,100)
          Path('fold_out').mkdir(exist_ok=True)
          json.dump({'date':str(td.date()),**st},open(f"fold_out/{td.date()}.json",'w'),indent=2)
          print(json.dumps({'date':str(td.date()),**st},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bag50-w50-fold-${{ matrix.date }}
          path: fold_out/*.json
          retention-days: 30

  aggregate:
    needs: fold
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-stability-fix
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bag50-w50-fold-*
          path: folds
          merge-multiple: true
      - name: Aggregate all folds
        run: |
          python - <<'PY'
          import glob,json,os
          rows=[json.load(open(p)) for p in sorted(glob.glob('folds/*.json'))]
          mj=sum(x['mean_jaccard'] for x in rows)/len(rows)
          wp=min(x['p05_jaccard'] for x in rows)
          t1=sum(x['top1_stability'] for x in rows)/len(rows)
          worst=min(rows,key=lambda x:x['p05_jaccard'])['date']
          s={'purpose':'parallel stability-only all-fold screen; no labels; pass is not promotion',
             'policy':'bag50_w50','folds':len(rows),'mean_jaccard':mj,'worst_p05_jaccard':wp,
             'mean_top1_stability':t1,'worst_fold':worst,
             'screen_pass':bool(mj>=.80 and wp>=.60 and t1>=.70),'by_fold':rows}
          os.makedirs('published_v10_2_bag50_w50_parallel',exist_ok=True)
          json.dump(s,open('published_v10_2_bag50_w50_parallel/summary.json','w'),indent=2)
          print(json.dumps(s,indent=2))
          PY
      - name: Publish aggregate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v10_2_bag50_w50_parallel
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish parallel Bag50 W50 all-fold screen [skip ci]"
          git pull --rebase origin v10.2-stability-fix
          git push origin HEAD:v10.2-stability-fix
