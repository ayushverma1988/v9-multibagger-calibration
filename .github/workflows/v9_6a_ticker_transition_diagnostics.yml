name: V9.6A Ticker Transition Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ v9.6-label-data-integrity ]
    paths:
      - 'src/ticker_transition_diagnostics_v9_6.py'
      - '.github/workflows/v9_6a_ticker_transition_diagnostics.yml'

concurrency:
  group: v9-6a-ticker-transition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/ticker_transition_diagnostics_v9_6.py
      - name: Diagnose 2010-2026 ticker transitions
        run: |
          PYTHONPATH=src python src/ticker_transition_diagnostics_v9_6.py             --start-year 2010             --end-year 2026             --output outputs_v9_6a_ticker_diag
      - uses: actions/upload-artifact@v4
        with:
          name: v9-6a-ticker-transition-diagnostics
          path: outputs_v9_6a_ticker_diag/
          retention-days: 90
