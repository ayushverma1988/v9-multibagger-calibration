name: V13 precise financial gap recovery and source preservation
on:
  workflow_dispatch:
  push:
    branches: [v13-precision-gap-recovery-20261021]
    paths: ['.github/workflows/v13_precision_gap_import_20261021.yml']
permissions:
  contents: read
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v12_frozen.txt -r requirements_v11_4_systematic.txt 'huggingface_hub>=0.34,<2'
      - name: Validate source equations and master contracts
        run: |
          python -m unittest discover -s tests -p 'test_v13_precision_gap_import.py'
          python -m unittest discover -s tests -p 'test_v13_master_data.py'
      - name: Fill missing cells from checked original source versions
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from v13_checkpoint import restore,save
          from v13_frozen_integrity import FrozenGuard
          from v13_precision_gap_import import apply
          from v13_master_data import export
          root=Path('v13_state')
          if not restore(root):raise RuntimeError('Current checkpoint required')
          guard=FrozenGuard(root)
          asof=json.loads((root/'latest_run.json').read_text())['asof']
          before=export(root,asof)
          imported=apply(root,Path('v13_evidence_seed/precision_gap_sources_20261021.json.gz.b64'))
          if imported['observation_validation_errors']:raise ValueError('Source observation validation failed')
          after=export(root,asof)
          integrity=guard.check(pd.read_parquet(root/'prospective_observations.parquet'))
          result={'before':before,'import':imported,'after':after,'frozen_integrity':integrity,'new_forecast_created':False,'cross_source_validation_required':False}
          (root/'master_data/precision_gap_import_20261021.json').write_text(json.dumps(result,indent=2))
          receipt=save(root)
          Path('precision_gap_archive_receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps({'before_missing':before['remaining_missing_or_unresolved_cells'],'after_missing':after['remaining_missing_or_unresolved_cells'],'accepted_observations':imported['accepted_observations'],'source_failures':len(imported['source_fetch_failures']),'frozen_integrity':integrity,'archive_receipt':receipt},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-precision-gap-import-${{ github.run_id }}
          retention-days: 30
          path: |
            v13_state/master_data/*.json
            v13_state/master_data/*.parquet
            v13_state/master_data/*.csv
            precision_gap_archive_receipt.json
