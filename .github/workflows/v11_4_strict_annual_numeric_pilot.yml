name: V11.4 Strict Annual PIT Numeric 5y7y Features
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_strict_annual_numeric_pilot.yml
permissions:
  actions: read
  contents: read
jobs:
  annual-numerics:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3' 'pyarrow>=18,<26'
      - name: Use pre-existing official NSE annual XBRL tag dictionary from frozen V11.4 rule probe
        run: |
          git fetch origin v10-fresh-current --depth 1
          git show FETCH_HEAD:src/v11_4_longterm_fundamentals.py > src/v11_4_longterm_fundamentals.py
          python -m py_compile src/v11_4_longterm_fundamentals.py src/v11_4_strict_annual_numeric_features.py
      - uses: actions/download-artifact@v4
        with:
          name: v11-4-historical-annual-filing-pilot
          path: annual_seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37747467876
      - name: Reconstruct 2024 historical growth from exact XBRL annual contexts only
        shell: bash
        run: |
          INDEX=$(find annual_seed -name annual_filings_source_index_PIT_CANDIDATES.csv -print -quit)
          test -n "$INDEX"
          python src/v11_4_strict_annual_numeric_features.py \
            --catalog "$INDEX" --fold-date 2024-12-31 \
            --max-companies 32 --max-years 8 \
            --output outputs_v11_4_strict_annual_numeric
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-strict-annual-PIT-5y7y-numeric-candidates
          path: outputs_v11_4_strict_annual_numeric/
          retention-days: 60
          if-no-files-found: warn
