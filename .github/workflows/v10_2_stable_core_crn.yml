name: V10.2 Stable-Core CRN

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-stability-fix ]
    paths:
      - 'src/v10_2_stable_core_crn.py'
      - '.github/workflows/v10_2_stable_core_crn.yml'

concurrency:
  group: v10-2-stable-core-crn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-stability-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/v10_2_raw_rank_stability.py src/v10_2_compression_switch.py src/v10_2_stable_core_crn.py
      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615
      - name: Run CRN stable-core selector
        run: |
          python src/v10_2_stable_core_crn.py \
            --oos v941/oos_predictions.parquet \
            --chosen931 v941/chosen_v931_config_by_fold.csv \
            --config config_v9_4_1.json \
            --grid-sims 100 \
            --confirm-sims 500 \
            --output outputs_v10_2_stable_core_crn
      - uses: actions/upload-artifact@v4
        with:
          name: v10-2-stable-core-crn-results
          path: outputs_v10_2_stable_core_crn/
          retention-days: 90
      - name: Publish CRN evidence to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published_v10_2_stable_core_crn
          mkdir -p published_v10_2_stable_core_crn
          cp outputs_v10_2_stable_core_crn/summary.json published_v10_2_stable_core_crn/summary.json
          cp outputs_v10_2_stable_core_crn/crn_grid.csv published_v10_2_stable_core_crn/crn_grid.csv
          cp outputs_v10_2_stable_core_crn/chosen_metrics_by_fold.csv published_v10_2_stable_core_crn/chosen_metrics_by_fold.csv
          cp outputs_v10_2_stable_core_crn/chosen_stability_by_fold.csv published_v10_2_stable_core_crn/chosen_stability_by_fold.csv
          cp outputs_v10_2_stable_core_crn/chosen_core_usage.csv published_v10_2_stable_core_crn/chosen_core_usage.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v10_2_stable_core_crn
          if git diff --cached --quiet; then
            echo "No CRN result changes"
            exit 0
          fi
          git commit -m "Publish V10.2 Stable-Core CRN evidence [skip ci]"
          git pull --rebase origin v10.2-stability-fix
          git push origin HEAD:v10.2-stability-fix
