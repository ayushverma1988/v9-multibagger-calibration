name: V11.4 Explainable Evidence Board

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V11.4 Primary Catalyst Evidence"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: v11-4-evidence-board
  cancel-in-progress: true

jobs:
  build-board:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Compile V11.4 intelligence code
        run: |
          python -m py_compile             src/v11_4_integrated_financials.py             src/v11_4_evidence_board.py

      - name: Download corrected primary catalyst evidence
        uses: actions/download-artifact@v4
        with:
          name: v11-4-primary-catalyst-evidence
          path: primary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download V11 market/promoter/accumulation evidence
        uses: actions/download-artifact@v4
        with:
          name: v11-transformation-first-challenger
          path: v11_market
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37426120089

      - name: Locate evidence files
        shell: bash
        run: |
          set -euo pipefail
          ALL_EVIDENCE=$(find primary -type f -name 'all_company_evidence.parquet' | head -n 1)
          COMPANY_LIST=$(find primary -type f -name 'company_catalyst_intelligence.csv' | head -n 1)
          MARKET=$(find v11_market -type f -name 'current_universe_scored.csv' | head -n 1)
          test -n "$ALL_EVIDENCE"
          test -n "$COMPANY_LIST"
          test -n "$MARKET"
          echo "ALL_EVIDENCE=$ALL_EVIDENCE" >> "$GITHUB_ENV"
          echo "COMPANY_LIST=$COMPANY_LIST" >> "$GITHUB_ENV"
          echo "MARKET=$MARKET" >> "$GITHUB_ENV"

      - name: Diagnostic sanity case - SHANTIGOLD
        run: |
          mkdir -p outputs_v11_4_board
          python - <<'PY'
          import json, pandas as pd, os
          e=pd.read_parquet(os.environ["ALL_EVIDENCE"])
          q=e[e["symbol"].astype(str).str.upper().eq("SHANTIGOLD")].copy()
          types=set()
          themes=set()
          for v in q.get("catalyst_types",[]):
              try: types.update(json.loads(v) if isinstance(v,str) else [])
              except: pass
          for v in q.get("themes",[]):
              try: themes.update(json.loads(v) if isinstance(v,str) else [])
              except: pass
          stage=pd.to_numeric(q.get("stage_weight"),errors="coerce") if len(q) else pd.Series(dtype=float)
          out={
              "case":"SHANTIGOLD",
              "diagnostic_only":True,
              "evidence_rows":int(len(q)),
              "primary_rows":int(pd.to_numeric(q.get("source_tier"),errors="coerce").eq(1).sum()) if len(q) else 0,
              "catalyst_types":sorted(types),
              "themes":sorted(themes),
              "max_stage_weight":float(stage.max()) if stage.notna().any() else None,
              "capacity_pct_max":float(pd.to_numeric(q.get("capacity_pct_max"),errors="coerce").max()) if len(q) and pd.to_numeric(q.get("capacity_pct_max"),errors="coerce").notna().any() else None,
              "detected_transformation_chain":bool(len(q) and ({"capacity","commissioning"} & types)),
              "note":"Not used as a model feature, weight or acceptance gate."
          }
          json.dump(out,open("outputs_v11_4_board/known_case_sanity.json","w"),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Extract integrated financial inflection for catalyst universe
        run: |
          python src/v11_4_integrated_financials.py             --symbols-file "$COMPANY_LIST"             --output outputs_v11_4_board/current_financial_inflection.csv             --max-symbols 120

      - name: Calculate catalyst-specific price absorption
        run: |
          python src/v11_4_catalyst_absorption.py \
            --evidence "$ALL_EVIDENCE" \
            --output outputs_v11_4_board/catalyst_absorption.csv

      - name: Build explainable catalyst evidence board
        run: |
          python src/v11_4_evidence_board.py             --evidence "$ALL_EVIDENCE"             --financials outputs_v11_4_board/current_financial_inflection.csv             --market-transform "$MARKET"             --absorption outputs_v11_4_board/catalyst_absorption.csv             --config config_v11_4_catalyst_intelligence.json             --output outputs_v11_4_board/evidence_board.csv

      - name: Enforce research-board quality gate
        run: |
          python - <<'PY'
          import json, pandas as pd
          s=json.load(open("outputs_v11_4_board/evidence_board_summary.json"))
          b=pd.read_csv("outputs_v11_4_board/evidence_board.csv")
          f=json.load(open("outputs_v11_4_board/financial_summary.json"))
          print(json.dumps({"board":s,"financial":f},indent=2))
          if s.get("primary_confirmed",0) < 10:
              raise SystemExit("Primary-confirmed catalyst universe too small")
          if s.get("evidence_qualified",0) < 5:
              raise SystemExit("Too few evidence-qualified short-term catalyst candidates")
          if f.get("coverage",0) < 0.70:
              raise SystemExit("Financial extraction coverage below 70%")
          if s.get("primary_confirmed",0) > 500:
              raise SystemExit("Primary confirmation semantics appear too broad")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v11-4-explainable-evidence-board
          path: outputs_v11_4_board/
          retention-days: 90

      - name: Archive V11.4 prospective evidence privately
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import HfApi

          stage=Path("hf_v11_4_stage")
          stage.mkdir(exist_ok=True)
          wanted=[
              ("outputs_v11_4_board/evidence_board.csv","evidence_board.csv"),
              ("outputs_v11_4_board/primary_confirmed_shortlist.csv","primary_confirmed_shortlist.csv"),
              ("outputs_v11_4_board/current_financial_inflection.csv","current_financial_inflection.csv"),
              ("outputs_v11_4_board/catalyst_absorption.csv","catalyst_absorption.csv"),
              ("outputs_v11_4_board/evidence_board_summary.json","evidence_board_summary.json"),
              ("outputs_v11_4_board/known_case_sanity.json","known_case_sanity.json"),
              (os.environ["ALL_EVIDENCE"],"all_company_evidence.parquet"),
              (os.environ["COMPANY_LIST"],"company_catalyst_intelligence.csv"),
          ]
          for src,name in wanted:
              p=Path(src)
              if p.exists(): shutil.copy2(p,stage/name)

          date="unknown"
          p=stage/"evidence_board.csv"
          if p.exists():
              try:
                  d=pd.read_csv(p)
                  if "latest_evidence" in d and d["latest_evidence"].notna().any():
                      date=str(pd.to_datetime(d["latest_evidence"],utc=True,errors="coerce").max().date())
              except Exception: pass

          api=HfApi(token=os.environ["HF_ARCHIVE_TOKEN"])
          api.upload_folder(
              folder_path=str(stage),
              repo_id="ayushverma1988/v10-multibagger-archive",
              repo_type="dataset",
              path_in_repo=f"v11_4/prospective/{date}/source_run_{os.environ['SOURCE_RUN_ID']}",
              commit_message=f"Archive V11.4 catalyst intelligence {date}",
          )
          print("Archived",len(list(stage.iterdir())),"V11.4 evidence files")
          PY

      - name: Publish V11.4 research board
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_v11_4_board
          cp outputs_v11_4_board/evidence_board_summary.json published_v11_4_board/
          cp outputs_v11_4_board/primary_confirmed_shortlist.csv published_v11_4_board/
          cp outputs_v11_4_board/current_financial_inflection.csv published_v11_4_board/
          cp outputs_v11_4_board/financial_summary.json published_v11_4_board/
          cp outputs_v11_4_board/known_case_sanity.json published_v11_4_board/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v11_4_board
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish V11.4 explainable catalyst research board [skip ci]"
          git pull --rebase origin v10-fresh-current
          git push origin HEAD:v10-fresh-current
