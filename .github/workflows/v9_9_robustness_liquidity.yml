name: V9.9 Robustness and Liquidity

on:
  workflow_dispatch:
  push:
    branches: [ v9.9-robustness-liquidity ]
    paths:
      - 'src/robustness_liquidity_v9_9.py'
      - '.github/workflows/v9_9_robustness_liquidity.yml'

concurrency:
  group: v9-9-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/robustness_liquidity_v9_9.py

      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615

      - name: Run robustness and liquidity diagnostics
        run: |
          python src/robustness_liquidity_v9_9.py \
            --oos v941/oos_predictions.parquet \
            --bootstrap 10000 \
            --output outputs_v9_9

      - uses: actions/upload-artifact@v4
        with:
          name: v9-9-robustness-liquidity-results
          path: outputs_v9_9/
          retention-days: 90
