name: V9.7 Event PIT Self-Test

on:
  workflow_dispatch:
  push:
    branches: [ v9.7-news-events-pit ]
    paths:
      - 'src/event_pit_v9_7.py'
      - 'config/event_taxonomy_v9_7.json'
      - '.github/workflows/v9_7_event_pit_selftest.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/event_pit_v9_7.py
      - run: PYTHONPATH=src python src/event_pit_v9_7.py --self-test
