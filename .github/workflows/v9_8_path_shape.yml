name: V9.8 Path-Shape Challenger

on:
  workflow_dispatch:
  push:
    branches: [ v9.8-multibagger-path-shape ]
    paths:
      - 'src/path_shape_challenger_v9_8.py'
      - '.github/workflows/v9_8_path_shape.yml'

concurrency:
  group: v9-8-path-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/path_shape_challenger_v9_8.py
      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615
      - name: Run path-shape challenger
        run: |
          python src/path_shape_challenger_v9_8.py             --snapshot v941/snapshot_dataset.parquet             --oos v941/oos_predictions.parquet             --chosen931 v941/chosen_v931_config_by_fold.csv             --config config_v9_4_1.json             --output outputs_v9_8_path
      - uses: actions/upload-artifact@v4
        with:
          name: v9-8-path-shape-results
          path: outputs_v9_8_path/
          retention-days: 90
