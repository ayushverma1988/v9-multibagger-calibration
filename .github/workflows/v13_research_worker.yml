name: V13 NSE Research Collector and Learner
on:
  schedule:
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v13_research_worker.yml']
permissions:
  contents: write
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f38f4b87c4a0392bda56461626108b50fee6bbd5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v12_frozen.txt -r requirements_v11_4_systematic.txt 'huggingface_hub>=0.34,<2'
      - name: Run resumable whole-public-NSE research worker
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: python -m v13_runner --state v13_state --seed v13_seed --history-budget 400 --filing-budget 400
      - name: Preserve complete restart state even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-private-research-state-${{ github.run_id }}
          path: |
            v13_state.tar.gz
            archive_receipt.json
            v13_state/latest_run.json
            v13_state/champion_latest_watchlist.json
            v13_state/challenger_latest_watchlist.json
            v13_state/prospective_observations.parquet
            v13_state/active_model.json
            v13_state/challenger_runs/**/summary.json
            v13_state/challenger_runs/**/learned_weights.json
          retention-days: 30

      - name: Publish aggregate collector health
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'operational/v13_collector_health.json';
            let report = {};
            if (fs.existsSync('v13_state/latest_run.json')) report = JSON.parse(fs.readFileSync('v13_state/latest_run.json', 'utf8'));
            const health = { checked_at_utc: new Date().toISOString(), workflow_run: context.runId, source_asof: report.asof || null, mode: 'PAPER_RESEARCH', job_state: '${{ job.status }}', accuracy_approved: false, errors: (report.errors || []).length, market_rows: report.current_verified_market_rows || 0, public_universe_rows: report.public_universe_rows || 0, financial_errors: report.steps?.financials?.errors?.length || 0, history_errors: report.steps?.history?.errors?.length || 0, history_usable: report.steps?.history?.usable || 0 };
            let sha;
            try { const old = await github.rest.repos.getContent({...context.repo, path, ref: 'main'}); sha = old.data.sha; } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, branch: 'main', path, sha, message: 'Record V13 collector health', content: Buffer.from(JSON.stringify(health, null, 2) + '\n').toString('base64')});
