name: V13 NSE Research Collector and Learner
on:
  schedule:
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v13_research_worker.yml']
permissions:
  contents: write
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2eadf8dda568924cca4e9606d908d1f90162e149
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v12_frozen.txt -r requirements_v11_4_systematic.txt 'huggingface_hub>=0.34,<2'
      - name: Run resumable whole-public-NSE research worker
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: python -m v13_runner --state v13_state --seed v13_seed --history-budget 3200 --filing-budget 1600
      - name: Preserve complete restart state even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-private-research-state-${{ github.run_id }}
          path: |
            v13_state.tar.gz
            archive_receipt.json
            v13_state/latest_run.json
            v13_state/champion_latest_watchlist.json
            v13_state/challenger_latest_watchlist.json
            v13_state/prospective_observations.parquet
            v13_state/active_model.json
            v13_state/paired_cohorts/*.json
            v13_state/paired_mature_observations.parquet
            v13_state/prospective_metrics.json
            v13_state/paired_evaluation.json
            v13_state/financial_wide.parquet
            v13_state/research_selection/*.json
            v13_state/redevelopment/*.json
            v13_state/bottom_recovery/*.json
            v13_state/retest_recovery/*.json
            v13_state/early_potential/*.json
            v13_state/early_potential/*.md
            v13_state/two_x_research/*.json
            v13_state/two_x_research/*.md
            v13_state/early_potential/cohorts/*.json
            v13_state/statement_eps/*.json
            v13_state/identity/symbol_changes.json
            v13_state/prediction_replay/**/*.json
            v13_state/prediction_replay/**/*.parquet
            v13_state/active_heads.joblib
            v13_state/challenger/research_heads.joblib
            v13_state/catalogue_recovery.json
            v13_state/research_experiments_initial.json
            v13_state/evidence/*.json
            v13_state/financial_crosscheck/*.json
            v13_state/sources/*/financial_inventory.json
            v13_state/catalyst_evidence/*.json
            v13_state/action_audit/*.json
            v13_state/challenger_runs/**/summary.json
            v13_state/challenger_runs/**/learned_weights.json
            v13_state/challenger_runs/**/predeclared_experiments.json
          retention-days: 30

      - name: Publish aggregate collector health
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'operational/v13_collector_health.json';
            let report = {};
            if (fs.existsSync('v13_state/latest_run.json')) report = JSON.parse(fs.readFileSync('v13_state/latest_run.json', 'utf8'));
            const health = { checked_at_utc: new Date().toISOString(), workflow_run: context.runId, source_asof: report.asof || null, mode: 'PAPER_RESEARCH', job_state: '${{ job.status }}', accuracy_approved: false, errors: (report.errors || []).length, market_rows: report.current_verified_market_rows || 0, public_universe_rows: report.public_universe_rows || 0, financial_errors: report.steps?.financials?.errors?.length || 0, financial_complete_rows: report.financial_complete_rows ?? null, financial_quality_pass_rows: report.financial_quality_pass_rows ?? null, financial_known_failure_rows: report.financial_known_failure_rows ?? null, execution_chain_supported_rows: report.execution_chain_supported_rows ?? null, source_bound_earnings_scenario_rows: report.source_bound_earnings_scenario_rows ?? null, history_errors: report.steps?.history?.errors?.length || 0, history_usable: report.steps?.history?.usable || 0, history_fresh_official_aligned: report.steps?.history?.fresh_official_aligned ?? null, universe_financial_coverage: report.universe_financial_coverage ?? null, financial_crosschecks: report.steps?.financial_crosschecks ?? null, paired_rows_per_model: report.paired_registration?.rows_per_model || 0, paired_cohort: report.paired_registration?.cohort_id || null, catalyst_documents: report.steps?.catalysts?.documents || 0, verified_entries: report.steps?.independent_entry_actions?.verified_entries || 0, independently_verified_mature_outcomes: report.independently_verified_mature_outcomes || 0, bottom_watch_eligible: report.redevelopment_diagnostics?.bottom_recovery_shadow?.eligible ?? null, bottom_watch_history_unknown: report.redevelopment_diagnostics?.bottom_recovery_shadow?.unknown_history ?? null, example_audit_status_counts: report.example_history_audit?.current_status_counts ?? null };
            let sha;
            try { const old = await github.rest.repos.getContent({...context.repo, path, ref: 'main'}); sha = old.data.sha; } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, branch: 'main', path, sha, message: 'Record V13 collector health', content: Buffer.from(JSON.stringify(health, null, 2) + '\n').toString('base64')});

