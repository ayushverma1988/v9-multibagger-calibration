name: V10.2 Blocker Stability Screen

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-stability-fix ]
    paths:
      - 'src/v10_2_blocker_screen.py'
      - '.github/workflows/v10_2_blocker_screen.yml'

concurrency:
  group: v10-2-blocker-screen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-stability-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/v10_2_robust_quantile.py src/v10_2_bagged_topk.py src/v10_2_blocker_screen.py
      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615
      - name: Run rejection-only blocker screen
        run: |
          python src/v10_2_blocker_screen.py \
            --oos v941/oos_predictions.parquet \
            --chosen931 v941/chosen_v931_config_by_fold.csv \
            --config config_v9_4_1.json \
            --sims 100 \
            --output published_v10_2_blocker_screen
      - name: Publish screen evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v10_2_blocker_screen
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish V10.2 blocker stability screen [skip ci]"
          git pull --rebase origin v10.2-stability-fix
          git push origin HEAD:v10.2-stability-fix
