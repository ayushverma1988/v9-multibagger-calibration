name: V11.4 Four-Screener Source Provenance Acceptance
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_four_screener_source_contract.yml
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<26' 'scikit-learn>=1.5,<2' 'requests>=2.31,<3' 'huggingface_hub>=0.25,<2' 'joblib>=1.4'
      - name: Confirm 3 original screener rules + fourth RSI and no financial PIT leakage
        run: |
          set -euo pipefail
          python -m py_compile src/v11_4_rule_input_provenance.py src/v11_4_publish_forward_private.py
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_rule_input_provenance.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_four_family_rsi.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_v11_4_forward_freeze_contract.py -v
