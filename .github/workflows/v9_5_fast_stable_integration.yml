name: V9.5 Fast Stable Integration

on:
  workflow_dispatch:
  push:
    branches: [ v9.5-fundamental-turnaround ]
    paths:
      - '.github/workflows/v9_5_fast_stable_integration.yml'

concurrency:
  group: v9-5-fast-stable-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: |
          python -m py_compile src/fund_calibration_stable.py
          python -m py_compile src/fast_stable_integration_v9_5.py

      - name: Download nine-fold V9.5 source
        uses: actions/download-artifact@v4
        with:
          name: v9-5-eightfold-calibration-results
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36688186328

      - name: Download stability predictions
        uses: actions/download-artifact@v4
        with:
          name: v9-5-calibration-stability-results
          path: stable
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36700536981

      - name: Run frozen-baseline stable integration
        run: |
          python src/fast_stable_integration_v9_5.py \
            --oos source/oos_predictions.parquet \
            --fund-oos source/fundamental_oos.parquet \
            --stable-preds stable/calibration_stability_predictions.parquet \
            --chosen931 source/chosen_v931_config_by_fold.csv \
            --current source/current_selection.csv \
            --summary source/summary.json \
            --config config_v9_5.json \
            --output outputs_v9_5_fast_stable

      - name: Upload fast integration
        uses: actions/upload-artifact@v4
        with:
          name: v9-5-fast-stable-integration-results
          path: outputs_v9_5_fast_stable/
          retention-days: 90

      - name: Publish compact result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          mkdir -p published_v9_5_fast_stable
          cp outputs_v9_5_fast_stable/summary.json \
             outputs_v9_5_fast_stable/fund_weight_search.csv \
             outputs_v9_5_fast_stable/chosen_v95_weight_by_fold.csv \
             outputs_v9_5_fast_stable/selection_metrics_by_fold.csv \
             outputs_v9_5_fast_stable/current_top50.csv \
             published_v9_5_fast_stable/
          git add published_v9_5_fast_stable
          git diff --cached --quiet || git commit -m "Publish fast stable V9.5 integration [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
