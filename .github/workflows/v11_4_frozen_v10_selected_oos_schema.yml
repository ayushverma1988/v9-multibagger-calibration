name: V11.4 Exact V10 Historical Selection Schema Check
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_frozen_v10_selected_oos_schema.yml
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'pyarrow>=18,<26'
      - uses: actions/download-artifact@v4
        with:
          name: v10-2-integrity-corrected-challenger
          path: frozen_control
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37059786518
      - name: Restore frozen V10 historical dates only
        run: |
          git fetch origin v10-fresh-current --depth 1
          git show FETCH_HEAD:published_v9_4_1/chosen_v941_gates_by_fold.csv > folds.csv
      - name: Inspect exact V10 pre-existing historical rank, prediction and label schema
        shell: bash
        run: |
          PRED=$(find frozen_control -name oos_predictions.parquet -print -quit)
          test -n "$PRED"
          python src/v11_4_audit_frozen_v10_oos.py \
            --oos "$PRED" --folds folds.csv --output outputs_v11_4_exact_v10_rank_schema
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v11-4-frozen-v10-exact-oos-rank-schema
          path: outputs_v11_4_exact_v10_rank_schema/
          retention-days: 60
