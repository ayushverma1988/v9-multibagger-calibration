      - run: pip install -r requirements.txt
      - name: Compile month normalizer
        run: python -m py_compile src/renormalize_saved_month.py

      - name: Download month catalog checkpoint
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.catalog_pattern }}
          path: source_catalog
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: ${{ matrix.run_id }}

      - name: Download month raw checkpoint
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.raw_pattern }}
          path: source_raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: ${{ matrix.run_id }}

      - name: Re-normalize and audit one month
        run: |
          Y="${{ matrix.year }}"
          M="${{ matrix.month }}"
          MM=$(printf "%02d" "$M")
          python src/renormalize_saved_month.py \
            --year "$Y" \
            --month "$M" \
            --source-kind monthly \
            --catalog-root source_catalog \
            --raw-root source_raw \
            --mapping config/xbrl_concept_map_v9_5.json \
            --output-dir "month_out/${Y}-${MM}"

      - name: Upload canonical monthly checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v9-5-monthly-renorm-${{ matrix.year }}-${{ matrix.month }}
          path: month_out/
          retention-days: 90
