name: V9.5 Canonical Monthly 2015-2026

on:
  workflow_dispatch:
  push:
    branches: [ v9.5-fundamental-turnaround ]
    paths:
      - '.github/workflows/v9_5_monthly_all_years.yml'

concurrency:
  group: v9-5-canonical-monthly-${{ github.ref }}
  cancel-in-progress: true

