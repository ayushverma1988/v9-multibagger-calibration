name: V13 history omission diagnosis
on:
  push:
    branches: [main]
    paths: [.github/workflows/v13_history_diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef5bc2f2cc87ede8a49500b823af50f4088c1c0f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - name: Retrieve pinned read-only inputs
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from huggingface_hub import HfApi,hf_hub_download
          from v13_checkpoint import ARCHIVE,materialize_one
          token=os.environ['HF_ARCHIVE_TOKEN']
          assert HfApi(token=token).repo_info(ARCHIVE,repo_type='dataset').private
          def fetch(p): return hf_hub_download(ARCHIVE,p,repo_type='dataset',token=token)
          raw=Path(fetch('v13/state/snapshots/20261015T202445Z_4d75089a1495.json')).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='4d75089a14959a8b3b4f8a77c58b9d7e74c22efc96a4cd89f89dc42858af0aba'
          root=Path('redevelopment_inputs');root.mkdir()
          (root/'manifest.json').write_bytes(raw)
          from urllib.parse import quote
          from datetime import datetime,timezone,timedelta
          symbols=['SURYODAY','BHARTIARTL','PNBGILTS']
          keys=set()
          for symbol in symbols:
              url='https://query1.finance.yahoo.com/v8/finance/chart/'+quote(symbol+'.NS',safe='')+'?interval=1d&period1=1665772200&period2=1792089000&events=div%2Csplits'
              keys.add(hashlib.sha256(url.encode()).hexdigest())
          items=[r for r in json.loads(raw)['files'] if (r['path'].startswith('sources/2026-10-15/history_raw/') and Path(r['path']).stem in keys) or (r['path'].startswith('history/securities/') and Path(r['path']).stem in {hashlib.sha256(s.encode()).hexdigest() for s in symbols}) or r['path'].startswith('official/')]
          with ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(lambda r:materialize_one(r,root,fetch),items))
          (root/'export_receipt.json').write_text(json.dumps({'snapshot':'20261015T202445Z_4d75089a1495','files':items,'read_only':True},indent=2))
          print('Verified exported files:',len(items))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v13-history-omission-inputs
          path: redevelopment_inputs/
          retention-days: 7
