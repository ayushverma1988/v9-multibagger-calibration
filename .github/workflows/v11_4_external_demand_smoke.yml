name: V11.4 External Demand Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v11_4_external_demand_smoke.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: v11-4-external-demand-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas pyarrow requests feedparser

      - name: Compile external demand collector
        run: python -m py_compile src/v11_4_external_demand.py

      - name: Bootstrap official-demand archive from last verified run
        if: ${{ hashFiles('published_v11_4_external_demand/external_demand_evidence.parquet') == '' }}
        uses: actions/download-artifact@v4
        with:
          name: v11-4-external-demand-smoke
          path: seed_v11_4_demand
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37624914649

      - name: Collect external theme demand
        run: |
          PRIOR=""
          if [ -f published_v11_4_external_demand/external_demand_evidence.parquet ]; then
            PRIOR="--prior-evidence published_v11_4_external_demand/external_demand_evidence.parquet"
          elif [ -f seed_v11_4_demand/external_demand_evidence.parquet ]; then
            PRIOR="--prior-evidence seed_v11_4_demand/external_demand_evidence.parquet"
          fi
          python src/v11_4_external_demand.py \
            --queries-config config/v11_4_discovery_queries.json \
            --source-config config/v11_4_external_demand_sources.json \
            --output outputs_v11_4_demand/external_demand_evidence.parquet \
            $PRIOR

      - name: Gate demand coverage
        run: |
          python - <<'PY'
          import json
          s=json.load(open("outputs_v11_4_demand/external_demand_summary.json"))
          print(json.dumps(s,indent=2))
          if not s.get("required_sources_ok",False):
              raise SystemExit("GDELT and Google News must both be healthy")
          if s.get("themes_with_any_evidence",0) < 3:
              raise SystemExit("Too few themes with demand evidence")
          if s.get("themes_with_direct_official_evidence",0) < 3:
              raise SystemExit("Direct official demand coverage below frozen minimum")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v11-4-external-demand-smoke
          path: outputs_v11_4_demand/
          retention-days: 30

      - name: Publish rolling external demand archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_v11_4_external_demand
          cp outputs_v11_4_demand/external_demand_evidence.parquet published_v11_4_external_demand/
          cp outputs_v11_4_demand/theme_demand_scores.csv published_v11_4_external_demand/
          cp outputs_v11_4_demand/external_demand_summary.json published_v11_4_external_demand/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v11_4_external_demand
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish rolling V11.4 external demand archive [skip ci]"
          git pull --rebase origin v10-fresh-current
          git push origin HEAD:v10-fresh-current
