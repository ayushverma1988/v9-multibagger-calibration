name: V9.6 Regime-Aware Challenger

on:
  workflow_dispatch:
  push:
    branches: [ v9.6-regime-aware ]
    paths:
      - 'src/calibrate_v9_6.py'
      - 'config_v9_6.json'
      - '.github/workflows/v9_6_regime.yml'

concurrency:
  group: v9-6-regime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Compile V9.6
        run: python -m py_compile src/calibrate_v9_6.py

      - name: Download frozen validated V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615

      - name: Run leakage-free regime challenger
        run: |
          python src/calibrate_v9_6.py \
            --oos v941/oos_predictions.parquet \
            --snapshot v941/snapshot_dataset.parquet \
            --config config_v9_6.json \
            --output outputs_v9_6

      - name: Upload V9.6 results
        uses: actions/upload-artifact@v4
        with:
          name: v9-6-regime-results
          path: outputs_v9_6/
          retention-days: 90

      - name: Publish compact V9.6 diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          mkdir -p published_v9_6
          cp outputs_v9_6/summary.json \
             outputs_v9_6/regime_by_fold.csv \
             outputs_v9_6/chosen_regime_config_by_fold.csv \
             outputs_v9_6/selection_metrics_by_fold.csv \
             published_v9_6/
          git add published_v9_6
          git diff --cached --quiet || git commit -m "Publish V9.6 regime challenger results [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
