name: V11.4 BSE Primary Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v11_4_bse_smoke.yml'

permissions:
  contents: read

concurrency:
  group: v11-4-bse-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas pyarrow requests beautifulsoup4

      - name: Compile BSE collector
        run: python -m py_compile src/v11_4_catalyst_graph.py src/v11_4_bse_primary.py

      - name: Collect BSE primary announcements
        run: |
          python src/v11_4_bse_primary.py             --output outputs_v11_4_bse/bse_primary.parquet             --queries-config config/v11_4_discovery_queries.json             --lookback-days 7             --max-pages 12

      - name: Gate BSE source
        run: |
          python - <<'PY'
          import json
          s=json.load(open("outputs_v11_4_bse/bse_primary_summary.json"))
          print(json.dumps(s,indent=2))
          if s.get("raw_announcements",0) < 20:
              raise SystemExit("BSE returned too few announcements")
          if s.get("meaningful_rows",0) < 5:
              raise SystemExit("BSE catalyst mapping too sparse")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v11-4-bse-primary-smoke
          path: outputs_v11_4_bse/
          retention-days: 30
