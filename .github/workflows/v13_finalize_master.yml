name: V13 two-source missing financial input recovery
env:
  V13_COMPACT_ARCHIVE: '1'
  V13_WORKING_CORE_ARCHIVE: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
on:
  workflow_dispatch:
  push:
    branches: [v13-master-data-20261020]
    paths: ['.github/workflows/v13_finalize_master.yml']
permissions:
  contents: read
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: src
      INDIAN_STOCK_API_CHECKOUT: ${{ github.workspace }}/api_source
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2302ced5fcf4f41a64264154d71682bf9eab9cf0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 0xramm/Indian-Stock-Market-API
          ref: 147cd5c92a7888104e0be63eef7ea72a5b61ad3e
          path: api_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v13_storage.txt
      - name: Check source identity, basis, clocks and reconciliation
        run: |
          python -m unittest discover -s tests -p 'test_v13_master_data.py'
          python -m unittest discover -s tests -p 'test_v13_alternate_sources.py'
          python -m unittest discover -s tests -p 'test_v13_yahoo_financials.py'
      - name: Restore newest collection, collect alternate sources and save two-source master
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: python -m v13_master_data --state v13_state --passes 0 --provider-budget 0 --alternate-budget 3200 --yahoo-budget 3200 --source-seconds 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-final-reviewed-master-${{ github.run_id }}
          path: |
            v13_state/master_data/*.json
            v13_state/master_data/*.csv
            v13_state/master_data/*.parquet
            v13_state/master_data/*.md
            v13_state/financial_wide.parquet
            v13_state/evidence/universe_financial_coverage.json
            master_archive_receipt.json
          retention-days: 30
