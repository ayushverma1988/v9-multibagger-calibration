name: V9 Artifact Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'diagnostics/**'
      - '.github/workflows/diagnose.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: v9-calibration-results
          path: results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36398827406
      - run: python diagnostics/diagnose.py
      - uses: actions/upload-artifact@v4
        with:
          name: v9-diagnostics
          path: diagnostics_out/
          retention-days: 90
