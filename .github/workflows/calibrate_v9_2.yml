name: V9.2 Clean Calibration

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/calibrate_v9_2.py'
      - '.github/workflows/calibrate_v9_2.yml'

jobs:
  calibrate-v9-2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Download verified legacy NSE artifacts from canonical V9.1 run
        uses: actions/download-artifact@v4
        with:
          pattern: nse-legacy-*
          path: legacy
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36398827406
      - name: Run clean V9.2 calibration
        run: python src/calibrate_v9_2.py --config config.json --output outputs_v9_2 --legacy-dir legacy
      - name: Upload V9.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v9-2-calibration-results
          path: outputs_v9_2/
          retention-days: 90
      - name: Publish compact V9.2 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p published_v9_2
          cp outputs_v9_2/summary.json outputs_v9_2/calibrator_comparison.csv outputs_v9_2/downside_calibrator_comparison.csv outputs_v9_2/topk_by_fold.csv outputs_v9_2/current_top50.csv published_v9_2/
          git add published_v9_2
          git diff --cached --quiet || git commit -m "Publish clean V9.2 results [skip ci]"
          git pull --rebase origin main
          git push origin main
