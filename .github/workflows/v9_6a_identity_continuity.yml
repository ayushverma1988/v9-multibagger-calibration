name: V9.6A Identity Continuity Audit

on:
  workflow_dispatch:
  push:
    branches: [ v9.6-label-data-integrity ]
    paths:
      - 'src/identity_continuity_v9_6.py'
      - '.github/workflows/v9_6a_identity_continuity.yml'

concurrency:
  group: v9-6a-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/identity_continuity_v9_6.py

      - name: Download stable V9.5 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-5-stable-calibration-results
          path: stable
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36700936515

      - name: Audit real snapshot identity continuity
        run: |
          python src/identity_continuity_v9_6.py \
            --oos stable/oos_predictions.parquet \
            --output outputs_v9_6a_identity

      - name: Upload identity audit
        uses: actions/upload-artifact@v4
        with:
          name: v9-6a-identity-continuity
          path: outputs_v9_6a_identity/
          retention-days: 90
