name: V10.2 Selected-Window Integrity Audit

on:
  workflow_dispatch:
  push:
    branches: [ v10.2-residual-integrity ]
    paths:
      - 'src/v10_2_selected_window_integrity.py'
      - '.github/workflows/v10_2_selected_window_integrity.yml'

concurrency:
  group: v10-2-selected-window-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-residual-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/v10_2_selected_window_integrity.py

      - name: Download frozen V9.4.1 artifact
        uses: actions/download-artifact@v4
        with:
          name: v9-4-1-signal-gated-results
          path: v941
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36448905615

      - name: Download canonical V9.7 event archive
        uses: actions/download-artifact@v4
        with:
          name: v9-7-canonical-events-2016-2026
          path: events
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36804202373

      - name: Download verified legacy NSE history
        uses: actions/download-artifact@v4
        with:
          pattern: nse-legacy-*
          path: legacy
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36398827406

      - name: Run selected-window integrity audit
        run: |
          python src/v10_2_selected_window_integrity.py \
            --oos v941/oos_predictions.parquet \
            --events events/events_all_2016_2026.parquet \
            --legacy-dir legacy \
            --output published_v10_2_selected_window_integrity

      - uses: actions/upload-artifact@v4
        with:
          name: v10-2-selected-window-integrity-results
          path: published_v10_2_selected_window_integrity/
          retention-days: 90

      - name: Publish integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v10_2_selected_window_integrity
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish selected-window integrity audit [skip ci]"
          git pull --rebase origin v10.2-residual-integrity
          git push origin HEAD:v10.2-residual-integrity
