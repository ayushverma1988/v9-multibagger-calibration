name: V13 retain required working state only
on:
  push:
    paths: ['.github/workflows/v13_required_state_only.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v13-private-research-state
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: src
      V13_COMPACT_ARCHIVE: '1'
      V13_WORKING_CORE_ARCHIVE: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_v13_storage.txt
      - name: Verify current working files, publish compact checkpoint, then retire other archive data
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from datetime import datetime, timezone
          import joblib
          from huggingface_hub import HfApi
          from v13_checkpoint import restore, ARCHIVE
          from v13_working_archive import save, retire, migration_matches, FORMAT, identities
          from v13_archive_codec import sha_file
          api=HfApi(token=os.environ['HF_ARCHIVE_TOKEN'])
          if not restore('required_state'): raise ValueError('Existing working checkpoint cannot restore')
          root=Path('required_state'); source_raw=(root/'remote_manifest.json').read_bytes()
          source=json.loads(source_raw)
          expected=identities(source)
          for name,(digest,size) in expected.items():
              p=root/name
              if not p.is_file() or p.stat().st_size!=size or sha_file(p)!=digest:
                  raise ValueError('Required working file failed verification')
          # Deserialize both existing model objects before any historical retirement.
          for name in ('active_heads.joblib','challenger/research_heads.joblib'):
              joblib.load(root/name)
          before=api.repo_info(ARCHIVE,repo_type='dataset',expand=['usedStorage','sha']).used_storage
          if source.get('format')!=FORMAT:
              publication=save(root,api)
              published=json.loads((root/'remote_manifest.json').read_bytes())
              if not migration_matches(source_raw,published):
                  raise ValueError('Compact migration did not retain every working file unchanged')
              Path('required_state_publication.json').write_text(json.dumps(publication,indent=2))
          # Free local staging before two independent remote restoration checks.
          shutil.rmtree('v13_core_staging',ignore_errors=True)
          result=retire('required_state_retirement.json',purge=True)
          if not restore('final_restart'): raise ValueError('Final production restore failed')
          for name,(digest,size) in expected.items():
              p=Path('final_restart')/name
              if p.stat().st_size!=size or sha_file(p)!=digest: raise ValueError('Post-deletion working data differs')
          for name in ('active_heads.joblib','challenger/research_heads.joblib'):
              joblib.load(Path('final_restart')/name)
          result.update(provider_bytes_before=before,provider_bytes_freed=None if before is None or result['provider_used_storage_bytes'] is None else before-result['provider_used_storage_bytes'],all_prior_working_files_preserved=len(expected),models_deserialized_before_and_after=True,production_restore_after_deletion=True,workflow_run=os.environ.get('GITHUB_RUN_ID'))
          Path('required_state_cleanup_health.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!='deleted_paths'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-required-state-cleanup-receipts
          path: |
            required_state_publication.json
            required_state_retirement.json
            required_state_cleanup_health.json
      - name: Publish measured storage and restart result
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const path='operational/v13_required_state_cleanup_health.json';
            const report=JSON.parse(fs.readFileSync('required_state_cleanup_health.json'));delete report.deleted_paths;
            let sha;try{sha=(await github.rest.repos.getContent({...context.repo,path,ref:'main'})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha,message:'Record verified working-only V13 storage cleanup',content:Buffer.from(JSON.stringify(report,null,2)).toString('base64')});
