# V11.4 official-demand adapter rev2
# V11.4 typed-magnitude-and-official-demand rev9
# V11.4 source integration rev6
# V11.4 final source semantics rev5
name: V11.4 Primary Catalyst Evidence

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v11_4_primary_evidence.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: v11-4-primary-evidence
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt beautifulsoup4 lxml pypdf feedparser

      - name: Compile V11.4 evidence code
        run: |
          python -m py_compile             src/v10_refresh_events.py             src/v11_4_collect_public_evidence.py             src/v11_4_catalyst_graph.py             src/v11_4_nse_primary_evidence.py             src/v11_4_deep_primary_candidates.py             src/v11_4_external_demand.py             src/v11_4_merge_evidence.py

      - name: Bootstrap official-demand archive from last verified run
        if: ${{ hashFiles('published_v11_4_external_demand/external_demand_evidence.parquet') == '' }}
        uses: actions/download-artifact@v4
        with:
          name: v11-4-external-demand-smoke
          path: seed_v11_4_demand
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 37624914649

      - name: Download canonical point-in-time event archive
        uses: actions/download-artifact@v4
        with:
          name: v9-7-canonical-events-2016-2026
          path: events_base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ayushverma1988/v9-multibagger-calibration
          run-id: 36804202373

      - name: Refresh recent official NSE announcements
        run: |
          python src/v10_refresh_events.py             --base-events events_base/events_all_2016_2026.parquet             --output outputs_v11_4_primary/events_current.parquet             --lookback-days 45

      - name: Extract Tier-1 NSE catalyst evidence
        run: |
          python src/v11_4_nse_primary_evidence.py             --events outputs_v11_4_primary/event_refresh_recent.parquet             --queries-config config/v11_4_discovery_queries.json             --output outputs_v11_4_primary/nse_primary_evidence.parquet             --fetch-attachments

      - name: Collect secondary discovery evidence
        run: |
          python src/v11_4_collect_public_evidence.py             --config config/v11_4_discovery_queries.json             --output outputs_v11_4_primary/public_evidence.parquet             --lookback-days 14             --max-records 120

      - name: Link secondary evidence to listed companies
        run: |
          python src/v11_4_catalyst_graph.py             --evidence outputs_v11_4_primary/public_evidence.parquet             --queries-config config/v11_4_discovery_queries.json             --source-registry config/v11_4_source_registry.json             --output outputs_v11_4_primary/secondary_company_evidence.parquet             --fetch-pages

      - name: Deep-verify candidate stories in official NSE documents
        run: |
          python src/v11_4_deep_primary_candidates.py \
            --events outputs_v11_4_primary/events_current.parquet \
            --secondary outputs_v11_4_primary/secondary_company_evidence.parquet \
            --initial-primary outputs_v11_4_primary/nse_primary_evidence.parquet \
            --queries-config config/v11_4_discovery_queries.json \
            --output outputs_v11_4_primary/nse_deep_primary_evidence.parquet \
            --lookback-days 240 \
            --max-seed-symbols 140 \
            --max-docs-per-symbol 12

      - name: Combine direct and deep Tier-1 evidence
        run: |
          python - <<'PY'
          import pandas as pd
          a=pd.read_parquet("outputs_v11_4_primary/nse_primary_evidence.parquet")
          b=pd.read_parquet("outputs_v11_4_primary/nse_deep_primary_evidence.parquet")
          cols=sorted(set(a.columns)|set(b.columns))
          for x in (a,b):
              for col in cols:
                  if col not in x:x[col]=pd.NA
          z=pd.concat([a[cols],b[cols]],ignore_index=True)
          if len(z): z=z.drop_duplicates("evidence_id").sort_values("published_ts",ascending=False)
          z.to_parquet("outputs_v11_4_primary/nse_primary_evidence_combined.parquet",index=False)
          print({"direct":len(a),"deep":len(b),"combined":len(z),"companies":z["symbol"].nunique() if len(z) else 0})
          PY

      - name: Collect dual-source plus direct official theme-demand evidence
        run: |
          PRIOR=""
          if [ -f published_v11_4_external_demand/external_demand_evidence.parquet ]; then
            PRIOR="--prior-evidence published_v11_4_external_demand/external_demand_evidence.parquet"
          elif [ -f seed_v11_4_demand/external_demand_evidence.parquet ]; then
            PRIOR="--prior-evidence seed_v11_4_demand/external_demand_evidence.parquet"
          fi
          python src/v11_4_external_demand.py \
            --queries-config config/v11_4_discovery_queries.json \
            --source-config config/v11_4_external_demand_sources.json \
            --output outputs_v11_4_primary/external_demand_evidence.parquet \
            $PRIOR

      - name: Merge primary and secondary catalyst intelligence
        run: |
          python src/v11_4_merge_evidence.py             --secondary outputs_v11_4_primary/secondary_company_evidence.parquet             --primary outputs_v11_4_primary/nse_primary_evidence_combined.parquet             --theme-demand outputs_v11_4_primary/theme_demand_scores.csv             --output outputs_v11_4_primary/all_company_evidence.parquet

      - name: Enforce evidence quality gate
        run: |
          python - <<'PY'
          import json
          a=json.load(open("outputs_v11_4_primary/nse_primary_summary.json"))
          d=json.load(open("outputs_v11_4_primary/external_demand_summary.json"))
          m=json.load(open("outputs_v11_4_primary/merged_catalyst_summary.json"))
          print(json.dumps({"nse":a,"demand":d,"merged":m},indent=2))
          if not d.get("required_sources_ok",False):
              raise SystemExit("GDELT and Google News health gate failed")
          if d.get("themes_with_direct_official_evidence",0) < 3:
              raise SystemExit("Insufficient direct official demand coverage")
          if a.get("meaningful_rows",0) < 20:
              raise SystemExit("Insufficient meaningful NSE primary catalyst rows")
          if m.get("primary_rows",0) < 20:
              raise SystemExit("Insufficient Tier-1 evidence after merge")
          if m.get("primary_confirmed_companies",0) < 10:
              raise SystemExit("Too few companies with primary-confirmed catalysts")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v11-4-primary-catalyst-evidence
          path: outputs_v11_4_primary/
          retention-days: 60

      - name: Publish evidence summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_v11_4_evidence
          cp outputs_v11_4_primary/nse_primary_summary.json published_v11_4_evidence/
          cp outputs_v11_4_primary/external_demand_summary.json published_v11_4_evidence/
          cp outputs_v11_4_primary/theme_demand_scores.csv published_v11_4_evidence/
          cp outputs_v11_4_primary/merged_catalyst_summary.json published_v11_4_evidence/
          cp outputs_v11_4_primary/company_catalyst_intelligence.csv published_v11_4_evidence/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_v11_4_evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish V11.4 primary catalyst evidence [skip ci]"
          git pull --rebase origin v10-fresh-current
          git push origin HEAD:v10-fresh-current
