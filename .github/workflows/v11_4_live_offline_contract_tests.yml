name: V11.4 Live NSE and Four-Screener Contract Tests
# RSI14 and dual-official-source discrepancy unit corrections validated on this branch.
on:
  workflow_dispatch:
  push:
    branches: [v11-4-ownership-backfill-probe]
    paths:
      - .github/workflows/v11_4_live_offline_contract_tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=18,<26' 'scikit-learn>=1.5,<2' 'joblib>=1.4' 'requests>=2.31,<3' 'huggingface_hub>=0.25,<2'
      - name: Compile independent NSE live price + filing + four-family research code
        run: |
          python -m py_compile src/v11_4_live_nse_market_catalyst.py \
            src/v11_4_four_family_live_screener.py \
            src/v11_4_publish_forward_private.py
      - name: Test exchange source integrity, full Wilder RSI14, user screen families, immutable forward scoring
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_v11_4_live_nse_sources.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_v11_4_four_family_rsi.py' -v
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_v11_4_forward_freeze_contract.py' -v
