name: Seed V10 Legacy NSE Archive

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v10_seed_legacy_hf.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: v10-seed-legacy-hf
  cancel-in-progress: false

jobs:
  seed-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10-fresh-current
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Compile legacy archive code
        run: |
          python -m py_compile \
            src/fetch_legacy_nse.py \
            src/v10_fetch_legacy_archive.py

      - name: Restore or rebuild complete verified 2003-2009 archive
        env:
          HF_ARCHIVE_TOKEN: ${{ secrets.HF_ARCHIVE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/v10_fetch_legacy_archive.py \
            --repo-id ayushverma1988/v10-multibagger-archive \
            --output-dir legacy_seed \
            --bootstrap-github-artifacts

      - name: Enforce complete archive gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path("legacy_seed")
          s=json.load(open(root/"legacy_fetch_summary.json"))
          files={int(x["year"]):x for x in s["files"]}
          missing=[y for y in range(2003,2010) if y not in files]
          if missing:
              raise SystemExit(f"Missing verified years: {missing}")

          for y in range(2003,2010):
              p=root/f"nse_{y}.parquet"
              if not p.exists():
                  raise SystemExit(f"Missing parquet: {p}")
              x=pd.read_parquet(p)
              x["date"]=pd.to_datetime(x["date"],errors="raise")
              if not x["date"].dt.year.eq(y).all():
                  raise SystemExit(f"Out-of-year rows in {y}")
              if len(x)<10000 or x["date"].nunique()<150:
                  raise SystemExit(
                      f"Sparse archive for {y}: rows={len(x)} dates={x['date'].nunique()}"
                  )

          print("Verified complete private HF legacy archive for 2003-2009")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v10-legacy-2003-2009-verified
          path: |
            legacy_seed/legacy_fetch_summary.json
            legacy_seed/manifest.json
          retention-days: 30
